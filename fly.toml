# fly.toml app configuration file generated for discord-qna-bot on 2026-08-12T18:46:12-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discord-qna-bot'
primary_region = 'iad'

[build]
[deploy]
  release_command = 'node deploy-commands.js'

[processes]
  app = 'node index.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
